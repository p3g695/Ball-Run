<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball Run 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #111;
      color: #fff;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    button {
      padding: 10px 20px;
      font-weight: bold;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #score-board {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 20px;
      font-weight: bold;
      z-index: 10;
    }
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: bold;
      display: none;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      padding: 20px 40px;
      border-radius: 10px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <button id="pause-btn">PAUSE</button>
  </div>
  <div id="score-board">Distance: <span id="dist">0</span>m | Checkpoint: <span id="cp">0</span></div>
  <div id="overlay">PAUSED</div>

  <script>
    let scene, camera, renderer, player;
    let speed = 0.3;
    let isPaused = false;
    let distance = 0;
    let lastCheckpoint = 0;
    let checkpointCount = 0;
    
    let obstacles = [];
    let checkpoints = [];
    let keys = {};

    // Controls
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    document.getElementById('pause-btn').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('overlay').style.display = isPaused ? 'block' : 'none';
      document.getElementById('pause-btn').innerText = isPaused ? 'RESUME' : 'PAUSE';
    });

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Lighting
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(0, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      // Player Ball
      const playerGeo = new THREE.SphereGeometry(1, 32, 32);
      const playerMat = new THREE.MeshStandardMaterial({ color: 0x00d2d3 });
      player = new THREE.Mesh(playerGeo, playerMat);
      player.position.set(0, 1, 0);
      scene.add(player);

      // Floor Track
      const trackGeo = new THREE.BoxGeometry(10, 0.1, 2000);
      const trackMat = new THREE.MeshStandardMaterial({ color: 0x222f3e });
      const track = new THREE.Mesh(trackGeo, trackMat);
      track.position.set(0, 0, -990);
      scene.add(track);

      // Spawn initial elements
      for (let z = -30; z > -1500; z -= 30) {
        spawnObstacle(z);
        if (Math.abs(z) % 150 === 0) spawnCheckpoint(z);
      }

      animate();
    }

    function spawnObstacle(z) {
      const size = Math.random() * 1.5 + 1;
      const geo = new THREE.BoxGeometry(size, size, size);
      const mat = new THREE.MeshStandardMaterial({ color: 0xff6b6b });
      const obs = new THREE.Mesh(geo, mat);
      
      const xPos = (Math.random() - 0.5) * 8;
      obs.position.set(xPos, size / 2, z);
      scene.add(obs);
      obstacles.push(obs);
    }

    function spawnCheckpoint(z) {
      const geo = new THREE.TorusGeometry(3, 0.2, 16, 100);
      const mat = new THREE.MeshBasicMaterial({ color: 0xfeca57 });
      const cp = new THREE.Mesh(geo, mat);
      cp.position.set(0, 2, z);
      scene.add(cp);
      checkpoints.push({ mesh: cp, z: z });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isPaused) return;

      // Player Forward Movement (Gets faster over distance)
      speed += 0.0001; 
      player.position.z -= speed;

      // Steering
      if (keys['ArrowLeft'] || keys['KeyA']) player.position.x -= 0.15;
      if (keys['ArrowRight'] || keys['KeyD']) player.position.x += 0.15;

      // Keep within track limits
      player.position.x = Math.max(-4.5, Math.min(4.5, player.position.x));

      // Camera Follows Player
      camera.position.set(player.position.x, player.position.y + 3, player.position.z + 8);
      camera.lookAt(player.position.x, player.position.y, player.position.z - 5);

      // Distance score updates
      distance = Math.floor(Math.abs(player.position.z));
      document.getElementById('dist').innerText = distance;

      // Checkpoint detection
      checkpoints.forEach(cp => {
        if (Math.abs(player.position.z - cp.z) < 2 && lastCheckpoint !== cp.z) {
          lastCheckpoint = cp.z;
          checkpointCount++;
          document.getElementById('cp').innerText = checkpointCount;
        }
      });

      // Collision Detection
      obstacles.forEach(obs => {
        const dist = player.position.distanceTo(obs.position);
        if (dist < 1.5) {
          // Reset to last checkpoint on collision
          player.position.z = lastCheckpoint;
          player.position.x = 0;
        }
      });

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
